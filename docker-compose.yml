services:
  mongo:
    image: mongo:7
    ports:
      # 27018 outside so it doesn't clash with a MongoDB already running on the host.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Development keeps Swagger on.
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__DatabaseName: todolists
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
